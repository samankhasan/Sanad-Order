<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-label="Sanad Tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E10E19"/>
      <stop offset=".2" stop-color="#F36F21"/>
      <stop offset=".4" stop-color="#FFCB05"/>
      <stop offset=".6" stop-color="#4FA62F"/>
      <stop offset=".8" stop-color="#0284D6"/>
      <stop offset="1" stop-color="#7B1B6A"/>
    </linearGradient>
  </defs>

  <!-- emblem: rotated rounded diamond, echoing the Sanad mark -->
  <g transform="translate(150 150)">
    <rect x="-92" y="-92" width="184" height="184" rx="34" transform="rotate(45)" fill="url(#bg)"/>
    <rect x="-92" y="-92" width="184" height="184" rx="34" transform="rotate(45)" fill="none" stroke="url(#stripe)" stroke-width="8"/>

    <!-- wrench -->
    <g transform="rotate(-45)">
      <rect x="-11" y="-38" width="22" height="104" rx="11" fill="url(#steel)"/>
      <path d="M0 -92a36 36 0 0 0-36 36c0 13 7 25 18 31l7 6h22l7-6c11-6 18-18 18-31a36 36 0 0 0-14-28v28l-11 9h-14l-11-9v-28c-4-3-1-8 14-8z" fill="url(#steel)"/>
    </g>

    <!-- paint brush -->
    <g transform="rotate(45)">
      <rect x="-9" y="-10" width="18" height="78" rx="9" fill="#F36F21"/>
      <rect x="-15" y="-30" width="30" height="24" rx="4" fill="url(#steel)"/>
      <path d="M-17 -30h34l-4 -44c-2 -16 -24 -16 -26 0z" fill="#FFCB05"/>
      <path d="M-13 -60c4 -12 22 -12 26 0l1 10h-28z" fill="#E10E19"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="290" y="160" font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="4" textLength="330" lengthAdjust="spacingAndGlyphs" fill="#0F172A">TOOLS</text>
  <rect x="292" y="180" width="330" height="12" rx="6" fill="url(#stripe)"/>
  <text x="622" y="236" text-anchor="end" font-family="'Noto Sans Arabic', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#475569">ئامرازەکان · العدد والأدوات</text>
</svg>
