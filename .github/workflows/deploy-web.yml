name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Public values (safe in the browser – data is protected by Row Level Security)
  VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
  VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
  VITE_FIREBASE_VAPID_KEY: ${{ vars.FIREBASE_VAPID_KEY }}
  VITE_FIREBASE_PROJECT_ID: sanad-notification-df624
  VITE_FIREBASE_SENDER_ID: "61648825417"
  VITE_SUPABASE_URL: https://sqyldiaacqcaozowrwgn.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CORochnLWs7Ie-PC0TDaHw_4fHk7XPk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
