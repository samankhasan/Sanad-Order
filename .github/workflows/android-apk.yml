name: Build Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  VITE_SUPABASE_URL: https://sqyldiaacqcaozowrwgn.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CORochnLWs7Ie-PC0TDaHw_4fHk7XPk

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - name: App icon & splash from Sanad logo
        run: npx capacitor-assets generate --android
        continue-on-error: true
      - run: npx cap sync android
      - name: Gradle build
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SanadOrder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
