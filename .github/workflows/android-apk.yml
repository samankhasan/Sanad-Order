name: Build Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  VITE_FIREBASE_PROJECT_ID: sanad-notification-df624
  VITE_FIREBASE_SENDER_ID: "61648825417"
  VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
  VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
  VITE_FIREBASE_VAPID_KEY: ${{ vars.FIREBASE_VAPID_KEY }}
  VITE_SUPABASE_URL: https://sqyldiaacqcaozowrwgn.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CORochnLWs7Ie-PC0TDaHw_4fHk7XPk

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > google-services.json
          elif [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json google-services.json
          fi
          if [ -f google-services.json ]; then
            echo "VITE_NATIVE_PUSH=1" >> $GITHUB_ENV
            echo "Push notifications: ENABLED"
          else
            echo "::warning::google-services.json missing — APK is built without push notifications"
          fi
      - run: npm run build
      - run: npx cap add android
      - name: Add google-services.json
        run: if [ -f google-services.json ]; then cp google-services.json android/app/; fi
      - name: App icon & splash from Sanad logo
        run: npx capacitor-assets generate --android
        continue-on-error: true
      - run: npx cap sync android
      - name: Gradle build
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SanadOrder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
