name: Android release (Google Play)

# Run manually: Actions → "Android release (Google Play)" → Run workflow
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  VITE_FIREBASE_PROJECT_ID: sanad-notification-df624
  VITE_FIREBASE_SENDER_ID: "61648825417"
  VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
  VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
  VITE_FIREBASE_VAPID_KEY: ${{ vars.FIREBASE_VAPID_KEY }}
  VITE_SUPABASE_URL: https://sqyldiaacqcaozowrwgn.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CORochnLWs7Ie-PC0TDaHw_4fHk7XPk
  VITE_NATIVE_PUSH: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD in Settings → Secrets → Actions"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - name: Firebase, icons, edge-to-edge
        run: |
          cp firebase/google-services.json android/app/
          cp native/android/MainActivity.java android/app/src/main/java/com/sanadcompany/sanadorder/MainActivity.java
          npx capacitor-assets generate --android || true
      - run: npx cap sync android
      - name: Version (code = run number, name = package.json)
        run: |
          VN=$(node -p "require('./package.json').version")
          VC=$((100 + ${{ github.run_number }}))
          sed -i -E "s/versionCode [0-9]+/versionCode $VC/; s/versionName \"[^\"]+\"/versionName \"$VN\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          echo "VC=$VC" >> $GITHUB_ENV; echo "VN=$VN" >> $GITHUB_ENV
      - name: Build release AAB + APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease assembleRelease --no-daemon
      - name: Sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > upload.jks
          mkdir -p out
          # AAB for Google Play (jarsigner)
          cp android/app/build/outputs/bundle/release/app-release.aab out/SanadOrder-$VN-$VC.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks -storepass "$KS_PASS" -keypass "$KEY_PASS" out/SanadOrder-$VN-$VC.aab "$KEY_ALIAS"
          # APK for direct install (zipalign + apksigner)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk out/aligned.apk
          $BT/apksigner sign --ks upload.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out out/SanadOrder-$VN-$VC.apk out/aligned.apk
          rm out/aligned.apk upload.jks
          $BT/apksigner verify out/SanadOrder-$VN-$VC.apk && echo "APK signature OK"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: SanadOrder-release-${{ env.VN }}-${{ env.VC }}
          path: out/*
